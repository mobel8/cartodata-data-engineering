name: "cartodata_de"
version: "1.0.0"
config-version: 2
profile: "cartodata_de"

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Couche SILVER produite par le pipeline Python (override par --vars en CI/prod).
  silver_path: "../data/silver/offres.parquet"
  run_date: "2026-06-10"

models:
  cartodata_de:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
