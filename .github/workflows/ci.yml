name: CI — Lakehouse ELT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 : version des venvs vérifiés en local ; les versions épinglées
          # (numpy 2.4.x, pandas 3.x) n'ont pas de distribution pour 3.11.
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires (pytest)
        # Les tests 'fullonly' (comptages de référence) sont sautés : la CI
        # tourne sur l'échantillon commité, pas sur le dataset complet.
        run: pytest -q

      - name: Pipeline ELT sur échantillon + dbt build + tests
        run: python -m cartodata_de.pipeline --ci --no-export

      - name: Générer la doc dbt (lineage)
        # dbt s'exécute TOUJOURS avec cwd = dbt/ (contrat de profiles.yml : path
        # ../warehouse/... relatif), comme le fait pipeline.py. Scalaire plié :
        # la ligne contient « deux-points espace » (JSON de --vars), interdit dans
        # un scalaire YAML non cité (le workflow d'origine échouait au chargement).
        working-directory: dbt
        run: >
          dbt docs generate --project-dir . --profiles-dir .
          --vars '{"silver_path": "../data/silver/offres.parquet", "run_date": "2099-01-01"}'

      - name: Publier la doc dbt en artefact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/
